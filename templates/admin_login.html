{% extends "base.html" %}{% block body %}
<h1>Researcher sign in</h1>
{% if failed %}
<p style="color:var(--warn)">Wrong password. Try again.</p>
{% endif %}
<form method="post">
    <label for="p">Password</label>
    <input id="p" type="password" name="password" autofocus>
    <p style="margin-top:16px">
        <button class="btn">Sign in</button>
    </p>
</form>{% endblock %}
